<html>

<head>

    <head>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js"
            integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
        <style>
            :root {
                --homePrimary: #5da6ec;
                --awayPrimary: #eccb5f;
                --activeColor: white;
                --replayColor: white;
                --activeBoostColor: white;
                --activeBorderColor: white;
                --backgroundColor: #12091f;
            }

            table {
                border-spacing: 20px 0px;
            }

            body {
                background-color: rgba(0, 0, 0, 0); margin: 0px auto; overflow: hidden;
                width: 1920px;
                height: 1080px;
            }

            

            .BestOf5 {
                position: absolute;
                padding: 15px;
                top: 0px;
                left: 6px;
                font-size: 38px;
                color: white;
                font-family: 'Bebas Neue';
            }

            .bo5 {
                position: absolute;
                top: 0px;
                left: 0px;
            }

            .backgroundImage {
                position: absolute;
                top: 0px;
                left: 0px;
                
            }

            .HomeScoreClass {
                position: absolute;
                top: 250px;
                right: 945px;
                font-size: 110px;
                color: black;
                font-family: 'Bebas Neue';
            }


            .AwayScoreClass {
                position: absolute;
                top: 250px;
                right: 900px;
                font-size: 110px;
                font-family: 'Bebas Neue';
                color: black;
            }

          
        </style>
    </head>

<body>

    <!-- Games Won -->
    <div class="gamesWon">
        <h1 class="HomeScoreClass" id="HomeScoreScreen">0-</h1>
        <h1 class="AwayScoreClass" id="AwayScoreScreen">0</h1>
        <!--<img class="backgroundImage" src="between games.png" style="z-index:-5";> -->

    </div>

</body>
<script src="Common/sos-replacement.js"></script>
<script>


    //code for overlay
var homeSeriesScore = 0;
var awaySeriesScore = 0;

$(() => {

    WsSubscribers.init(49122, false);

    WsSubscribers.subscribe("game", "match_ended", (d) => {

        console.log("MATCH ENDED", d);

        var teamNum = d['winner_team_num'];

        if (teamNum == 0) {
            homeSeriesScore = homeSeriesScore + 1;
        }

        if (teamNum == 1) {
            awaySeriesScore = awaySeriesScore + 1;
        }

        document.getElementById("HomeScoreScreen").innerHTML =
            homeSeriesScore + "-";

        document.getElementById("AwayScoreScreen").innerHTML =
            awaySeriesScore;
    });

});


</script>
</head>

</html>
